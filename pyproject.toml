[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luhdm"
version = "0.1.0"
description = "Levitated-sensor ultraheavy dark matter: physics models and limit setting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
]
# Also requires optimum-interval (not on PyPI yet):
#   pip install -e ~/code/optimum_interval

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbformat", "nbclient", "ipykernel"]
# notebook 00 reads the raw transient/efficiency data in data/; these load the
# pandas/PyTables HDF5 (jax is needed to unpickle its object columns).
notebooks = ["pandas", "tables", "h5py", "jax", "jupyterlab"]

[tool.setuptools]
packages = ["luhdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
